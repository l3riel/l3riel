name: Update stats

on:
  schedule:
    - cron: "17 3 * * *"   # todo dia, 03:17 UTC (00:17 em Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar assets/p-stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats.py
      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/p-stats.svg
          git diff --cached --quiet || (git commit -m "chore(stats): atualiza streak e contribuições" && git push)
